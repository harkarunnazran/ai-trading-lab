[project]
name = "ai-trading-lab"
version = "0.0.1"
readme = "README.md"
authors = [
    { name = "Harkarun Nazran", email = "harkarunsnazran@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "ipykernel"
]

[project.scripts]
ai-trading-lab = "ai_trading_lab:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "hypothesis>=6.170.8",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
